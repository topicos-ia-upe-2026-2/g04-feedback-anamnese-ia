# Pilot, not a completed model-selection exercise. Paths resolved by motor.train.
train: true
fine_tune_type: lora
seed: 42
num_layers: 4
batch_size: 1
iters: 40
val_batches: 4
learning_rate: 0.0001
steps_per_report: 5
steps_per_eval: 20
save_every: 20
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
optimizer: adam
lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 16.0
