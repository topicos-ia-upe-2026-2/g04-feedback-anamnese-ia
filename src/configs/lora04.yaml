# LoRA-04: receita sugerida na revisão do professor (PR #2), ajustada ao M5 de 16 GiB.
# Mais dados (1.000 exemplos sorteados com semente 42), mais camadas e rank, aquecimento e decaimento
# cosseno da taxa de aprendizado. Checkpoints a cada 100 passos, escolhidos por extração na validação.
train: true
fine_tune_type: lora
seed: 42
num_layers: 16
batch_size: 1
iters: 800
val_batches: 16
learning_rate: 0.0001
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [0.0001, 800, 0.000001]
steps_per_report: 20
steps_per_eval: 100
save_every: 100
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
optimizer: adam
lora_parameters:
  keys: [self_attn.q_proj, self_attn.k_proj, self_attn.v_proj, self_attn.o_proj, mlp.gate_proj, mlp.up_proj, mlp.down_proj]
  rank: 16
  dropout: 0.05
  scale: 10.0
pilot_train: 1000
pilot_valid: 32
fixed_ids: null
